<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeMessage</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}
body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 10% 10%, #2563eb55, transparent 35%),
        radial-gradient(circle at 90% 90%, #7c3aed55, transparent 35%),
        #070b13;
    color: white;
    padding: 25px;
}
.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}
header {
    text-align: center;
    margin-bottom: 35px;
}
.logo {
    width: 75px;
    height: 75px;
    margin: auto;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    font-size: 30px;
    font-weight: bold;
    box-shadow: 0 15px 50px #0008;
}
h1 {
    font-size: 38px;
    margin-top: 18px;
}
.subtitle {
    margin-top: 8px;
    color: #94a3b8;
}
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}
.card {
    background: #0f172acc;
    border: 1px solid #ffffff12;
    border-radius: 22px;
    padding: 25px;
    box-shadow: 0 20px 60px #0008;
    backdrop-filter: blur(15px);
}
.card h2 {
    margin-bottom: 20px;
}
label {
    display: block;
    color: #cbd5e1;
    margin: 15px 0 8px;
    font-size: 14px;
}
input,
textarea {
    width: 100%;
    border: 1px solid #334155;
    background: #080d16;
    color: white;
    padding: 14px;
    border-radius: 12px;
    outline: none;
    font-size: 16px;
}
input:focus,
textarea:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px #3b82f622;
}
textarea {
    min-height: 160px;
    resize: vertical;
}
button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 14px;
    margin-top: 18px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    transition: .2s;
}
button:hover {
    transform: translateY(-2px);
    filter: brightness(1.12);
}
.secondary {
    background: #1e293b;
}
.danger {
    background: #991b1b;
}
.result {
    display: none;
    margin-top: 20px;
    padding: 18px;
    border-radius: 15px;
    background: #07111f;
    border: 1px solid #1e40af;
}
.code-display {
    margin-top: 8px;
    color: #60a5fa;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 2px;
    word-break: break-word;
}
.message-display {
    margin-top: 15px;
    padding: 16px;
    border-radius: 12px;
    background: #111827;
    line-height: 1.6;
    white-space: pre-wrap;
}
.success {
    color: #4ade80;
}
.error {
    color: #f87171;
}
.info {
    color: #94a3b8;
    font-size: 14px;
    margin-top: 10px;
}
.history {
    margin-top: 22px;
}
.history-item {
    background: #080d16;
    border: 1px solid #1e293b;
    border-radius: 14px;
    padding: 15px;
    margin-top: 10px;
}
.history-code {
    color: #60a5fa;
    font-size: 17px;
    font-weight: bold;
}
.history-message {
    margin-top: 7px;
    color: #cbd5e1;
    white-space: pre-wrap;
}
.empty {
    color: #64748b;
    text-align: center;
    padding: 20px;
}
.footer {
    text-align: center;
    color: #64748b;
    margin-top: 30px;
    font-size: 13px;
}
@media(max-width: 800px) {
    body {
        padding: 15px;
    }
    .grid {
        grid-template-columns: 1fr;
    }
    h1 {
        font-size: 30px;
    }
}
</style>
</head>
<body>
<div class="container">
<header>
    <div class="logo">
        CM
    </div>
    <h1>CodeMessage</h1>
    <div class="subtitle">
        Nachrichten über einen eigenen Code abrufen
    </div>
</header>
<div class="grid">
<!-- ========================= -->
<!-- NACHRICHT ERSTELLEN -->
<!-- ========================= -->
<section class="card">
<h2>✏️ Nachricht erstellen</h2>
<label for="newCode">
    Dein eigener Code
</label>
<input
    id="newCode"
    type="text"
    placeholder="z. B. EINSATZ-4827"
    autocomplete="off"
>
<label for="newMessage">
    Nachricht
</label>
<textarea
    id="newMessage"
    placeholder="z. B. Hallo, der Einsatz ist beendet."
></textarea>
<button onclick="saveMessage()">
    💾 Nachricht speichern
</button>
<div id="saveResult" class="result">
    <div class="success">
        ✓ Nachricht wurde gespeichert
    </div>
    <div class="info">
        Dein Code:
    </div>
    <div
        id="savedCode"
        class="code-display">
    </div>
</div>
</section>
<!-- ========================= -->
<!-- NACHRICHT ABRUFEN -->
<!-- ========================= -->
<section class="card">
<h2>🔎 Nachricht abrufen</h2>
<label for="searchCode">
    Code eingeben
</label>
<input
    id="searchCode"
    type="text"
    placeholder="z. B. EINSATZ-4827"
    autocomplete="off"
>
<button onclick="findMessage()">
    🔍 Nachricht anzeigen
</button>
<div id="searchError"
     class="error"
     style="margin-top:15px;">
</div>
<div id="searchResult" class="result">
    <div class="success">
        ✓ Nachricht gefunden
    </div>
    <div
        id="foundCode"
        class="code-display">
    </div>
    <div
        id="foundMessage"
        class="message-display">
    </div>
</div>
</section>
</div>
<!-- ========================= -->
<!-- GESPEICHERTE NACHRICHTEN -->
<!-- ========================= -->
<section class="card history">
<h2>📚 Gespeicherte Nachrichten</h2>
<div id="historyList">
    <div class="empty">
        Noch keine Nachrichten vorhanden.
    </div>
</div>
<button
    class="danger"
    onclick="deleteAllMessages()">
    🗑️ Alle Nachrichten löschen
</button>
</section>
<div class="footer">
    CodeMessage • Nachrichten-System
</div>
</div>
<script>
/*
==================================================
CODEMESSAGE
==================================================
Beispiel:
Code:
EINSATZ-4827
Nachricht:
Hallo, der Einsatz ist beendet.
Eingabe:
EINSATZ-4827
Ergebnis:
Hallo, der Einsatz ist beendet.
==================================================
*/
// ================================================
// GESPEICHERTE NACHRICHTEN LADEN
// ================================================
let messages =
    JSON.parse(
        localStorage.getItem("codeMessageData")
    ) || {};
// ================================================
// NACHRICHT SPEICHERN
// ================================================
function saveMessage() {
    const codeInput =
        document.getElementById("newCode");
    const messageInput =
        document.getElementById("newMessage");
    const code =
        codeInput.value.trim().toUpperCase();
    const message =
        messageInput.value.trim();
    // Code prüfen
    if (!code) {
        alert("Bitte einen Code eingeben.");
        codeInput.focus();
        return;
    }
    // Nachricht prüfen
    if (!message) {
        alert("Bitte eine Nachricht eingeben.");
        messageInput.focus();
        return;
    }
    // Prüfen ob Code schon existiert
    if (messages[code]) {
        const overwrite =
            confirm(
                "Dieser Code existiert bereits.\n\n" +
                "Soll die alte Nachricht ersetzt werden?"
            );
        if (!overwrite) {
            return;
        }
    }
    // Nachricht speichern
    messages[code] = {
        message: message,
        created:
            new Date().toLocaleString("de-DE")
    };
    saveToBrowser();
    // Ergebnis anzeigen
    document.getElementById("savedCode")
        .textContent = code;
    document.getElementById("saveResult")
        .style.display = "block";
    // Eingabefelder leeren
    codeInput.value = "";
    messageInput.value = "";
    // Verlauf aktualisieren
    showHistory();
}
// ================================================
// NACHRICHT ABRUFEN
// ================================================
function findMessage() {
    const input =
        document.getElementById("searchCode");
    const code =
        input.value.trim().toUpperCase();
    const result =
        document.getElementById("searchResult");
    const error =
        document.getElementById("searchError");
    // Alte Meldungen entfernen
    result.style.display = "none";
    error.textContent = "";
    if (!code) {
        error.textContent =
            "Bitte einen Code eingeben.";
        return;
    }
    // Nachricht suchen
    if (!messages[code]) {
        error.textContent =
            "❌ Dieser Code wurde nicht gefunden.";
        return;
    }
    // Nachricht anzeigen
    document.getElementById("foundCode")
        .textContent = code;
    document.getElementById("foundMessage")
        .textContent = messages[code].message;
    result.style.display = "block";
}
// ================================================
// BROWSER-SPEICHER
// ================================================
function saveToBrowser() {
    localStorage.setItem(
        "codeMessageData",
        JSON.stringify(messages)
    );
}
// ================================================
// VERLAUF ANZEIGEN
// ================================================
function showHistory() {
    const container =
        document.getElementById("historyList");
    const codes =
        Object.keys(messages);
    if (codes.length === 0) {
        container.innerHTML = `
            <div class="empty">
                Noch keine Nachrichten vorhanden.
            </div>
        `;
        return;
    }
    container.innerHTML = "";
    codes.reverse().forEach(code => {
        const item =
            document.createElement("div");
        item.className =
            "history-item";
        const codeElement =
            document.createElement("div");
        codeElement.className =
            "history-code";
        codeElement.textContent =
            code;
        const messageElement =
            document.createElement("div");
        messageElement.className =
            "history-message";
        messageElement.textContent =
            messages[code].message;
        const dateElement =
            document.createElement("div");
        dateElement.className =
            "info";
        dateElement.textContent =
            "Erstellt: " +
            messages[code].created;
        item.appendChild(codeElement);
        item.appendChild(messageElement);
        item.appendChild(dateElement);
        container.appendChild(item);
    });
}
// ================================================
// ALLE NACHRICHTEN LÖSCHEN
// ================================================
function deleteAllMessages() {
    if (
        !confirm(
            "Wirklich ALLE Nachrichten löschen?"
        )
    ) {
        return;
    }
    messages = {};
    localStorage.removeItem(
        "codeMessageData"
    );
    showHistory();
    document.getElementById("saveResult")
        .style.display = "none";
    document.getElementById("searchResult")
        .style.display = "none";
}
// ================================================
// ENTER-TASTE BEIM ABRUFEN
// ================================================
document
    .getElementById("searchCode")
    .addEventListener(
        "keydown",
        function(event) {
            if (event.key === "Enter") {
                findMessage();
            }
        }
    );
// ================================================
// BEIM START LADEN
// ================================================
showHistory();
</script>
</body>
</html>
